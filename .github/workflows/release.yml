name: Installer

# Builds the Windows installer on every pull request and push to main (so packaging can't rot),
# smoke-tests it by installing it on the runner, and publishes a GitHub release for a "v*" tag.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  installer:
    runs-on: windows-latest
    permissions:
      contents: write # only used by the release step, which runs for tags
      actions: read # SignPath reads the unsigned installer artifact
    env:
      # Code signing turns on once the SignPath secrets exist (docs/signing.md).
      SIGNING: ${{ secrets.SIGNPATH_API_TOKEN != '' && startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build the front end
        working-directory: web
        run: |
          npm ci
          npm run build

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.9"
          cache: pip
      - name: Build the wheel
        run: |
          python -m pip install build -c packaging/constraints.txt -e ".[ui]"
          python -m build --wheel

      - name: Read the version
        id: version
        shell: bash
        run: echo "version=$(python -c 'import tandem; print(tandem.__version__)')" >> "$GITHUB_OUTPUT"

      - name: Build the app folder
        shell: bash
        run: python packaging/build_bundle.py --wheel dist/tandem-*.whl --out build/Tandem --python-version 3.11.9

      - name: Smoke-test the app folder
        run: python packaging/build_bundle.py --smoke build/Tandem

      - name: Fetch the WebView2 bootstrapper
        shell: pwsh
        run: Invoke-WebRequest "https://go.microsoft.com/fwlink/p/?LinkId=2124703" -OutFile build/MicrosoftEdgeWebview2Setup.exe

      - name: Build the installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; }
          & $iscc "/DAppVersion=${{ steps.version.outputs.version }}" packaging\tandem.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload the unsigned installer for signing
        id: unsigned
        if: env.SIGNING == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-setup
          path: dist/Tandem-${{ steps.version.outputs.version }}-setup.exe

      - name: Sign the installer (SignPath Foundation)
        if: env.SIGNING == 'true'
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: tandem
          signing-policy-slug: release-signing
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: dist

      - name: Install, smoke-test and uninstall
        shell: pwsh
        run: |
          $setup = "dist\Tandem-${{ steps.version.outputs.version }}-setup.exe"
          # The privacy page's choices reach the settings file (docs/privacy-policy.md).
          Start-Process $setup -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /NoAppIcons=1 /NoUpdateCheck=1" -Wait
          $settings = Get-Content "$env:LOCALAPPDATA\Tandem\settings.json" -Raw | ConvertFrom-Json
          if ($settings.app_icons -ne $false -or $settings.update_check -ne $false) { Write-Error "Setup didn't turn the online lookups off"; exit 1 }
          Remove-Item "$env:LOCALAPPDATA\Tandem\settings.json"
          # Setup compiles the libraries (checked before anything else runs Python there).
          if (-not (Test-Path "$env:ProgramFiles\Tandem\python\Lib\site-packages\tandem\__pycache__")) { Write-Error "Setup didn't compile Tandem's libraries"; exit 1 }
          python packaging/build_bundle.py --smoke "$env:ProgramFiles\Tandem"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # One rule: allowed from the local subnet on every network type, Public included
          # (ADR-0017, ADR-0021). An update from an older Tandem removes its Public block rule.
          $rules = @(Get-NetFirewallRule -DisplayName "Tandem" -ErrorAction SilentlyContinue)
          if ($rules.Count -ne 1 -or $rules[0].Action -ne "Allow") { $rules | Format-List; Write-Error "Expected one allow rule"; exit 1 }
          $remote = ($rules[0] | Get-NetFirewallAddressFilter).RemoteAddress
          if ("$($rules[0].Profile)" -ne "Any" -or "$remote" -ne "LocalSubnet") {
            $rules[0] | Format-List; Write-Error "The allow rule isn't every network and local subnet only"; exit 1
          }

          # Setup closes a running Tandem itself (ADR-0017, 1.2.1 addendum): a copy that listens
          # for setup quits cleanly, and anything else run from Tandem's folder (here a stand-in
          # for a copy from before 1.2.1) is stopped. Windows' "close applications" prompt never
          # shows.
          $pythonw = "$env:ProgramFiles\Tandem\python\pythonw.exe"
          function Start-Tandem {
            $process = Start-Process $pythonw -ArgumentList "-m tandem.ui --demo --no-window" -PassThru
            $null = $process.Handle # keeps the exit code readable
            $listening = $null
            for ($i = 0; $i -lt 120 -and -not [System.Threading.EventWaitHandle]::TryOpenExisting("Local\TandemQuit", [ref]$listening); $i++) { Start-Sleep -Milliseconds 500 }
            if (-not $listening) { Write-Error "Tandem didn't start listening for setup"; exit 1 }
            $listening.Dispose()
            return $process
          }
          $tandem = Start-Tandem
          $older = Start-Process $pythonw -ArgumentList "-c `"import time; time.sleep(600)`"" -PassThru
          $null = $older.Handle
          $update = Start-Process $setup -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /LOG=setup-update.log" -Wait -PassThru
          if ($update.ExitCode -ne 0) { Get-Content setup-update.log; Write-Error "Installing over a running Tandem failed ($($update.ExitCode))"; exit 1 }
          if (-not $tandem.WaitForExit(1000) -or $tandem.ExitCode -ne 0) { Get-Content setup-update.log; Write-Error "Setup didn't get Tandem to quit cleanly"; exit 1 }
          if (-not $older.WaitForExit(1000) -or $older.ExitCode -ne 1) { Get-Content setup-update.log; Write-Error "Setup didn't stop the older copy"; exit 1 }
          if (Select-String -Path setup-update.log -Pattern "found an application using one of our files" -Quiet) { Get-Content setup-update.log; Write-Error "Windows' close-applications prompt would have shown"; exit 1 }

          # The uninstaller closes it too, so it can remove every file.
          $tandem = Start-Tandem
          Start-Process "$env:ProgramFiles\Tandem\unins000.exe" -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART" -Wait
          if (-not $tandem.WaitForExit(1000) -or $tandem.ExitCode -ne 0) { Write-Error "Uninstall didn't get Tandem to quit cleanly"; exit 1 }
          if (Test-Path "$env:ProgramFiles\Tandem\python") { Write-Error "Uninstall left files"; exit 1 }
          if (Get-NetFirewallRule -DisplayName "Tandem" -ErrorAction SilentlyContinue) { Write-Error "Uninstall left firewall rules"; exit 1 }

      - name: Portable zip
        shell: pwsh
        run: Compress-Archive -Path build\Tandem\* -DestinationPath "dist\Tandem-${{ steps.version.outputs.version }}-portable.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: tandem-${{ steps.version.outputs.version }}
          path: |
            dist/*.exe
            dist/*.zip
            dist/*.whl

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.exe dist/*.zip dist/*.whl \
            --title "Tandem ${{ steps.version.outputs.version }}" \
            --notes-file docs/release-notes.md --prerelease
