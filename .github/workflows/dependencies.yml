name: Dependency check

# Once a month, try the newest versions of Tandem's libraries (within pyproject.toml's ranges)
# against the tests. If they pass and anything moved, open a pull request that updates
# packaging/constraints.txt, so the pinned set doesn't go stale (ADR-0017 addendum). A pin only
# lands after review and a hardware check. If the tests fail, the run fails and says so.
#
# GitHub doesn't run other workflows on a pull request this job opens: close and reopen it (or
# push to its branch) to run CI and the installer build before merging.
on:
  schedule:
    - cron: "0 6 1 * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  update:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.9"
      - name: Install the newest allowed versions
        run: python -m pip install --upgrade -e ".[dev,ui]"
      - name: Test
        run: python -m pytest -q
      - name: Update the pins
        run: python tools/update_constraints.py
      - name: Open a pull request if anything moved
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet packaging/constraints.txt; then
            echo "Every pin is current."
            exit 0
          fi
          branch="deps/update-$(date +%Y-%m-%d)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git commit -am "Update pinned library versions"
          git push -u origin "$branch"
          gh pr create --draft --base main --head "$branch" \
            --title "Update pinned library versions" \
            --body "The tests pass with these newer library versions. Before merging: close and reopen this pull request so CI and the installer build run, and check pairing and audio on the reference devices (CLAUDE.md, ADR-0017)."

  firmware-watch:
    # Apple's OS updates are what break AirPlay senders most (AirParrot shipped fixes for
    # HomePod 15.4 and tvOS 27). pyatv usually follows within weeks, often in a new minor
    # version that pyproject.toml's range (<0.19 and so on) keeps out. When pyatv has a newer
    # minor than Tandem allows, open one issue so the pin is moved on purpose, with a
    # hardware check.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compare pyatv's newest release with Tandem's range
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          newest=$(curl -fsSL https://pypi.org/pypi/pyatv/json | python3 -c "import json,sys; print(json.load(sys.stdin)['info']['version'])")
          allowed=$(grep -oE '"pyatv>=[0-9.]+,<[0-9.]+"' pyproject.toml | grep -oE '<[0-9.]+' | tr -d '<')
          echo "pyatv newest: $newest; Tandem allows below $allowed" >> "$GITHUB_STEP_SUMMARY"
          if python3 -c "import sys; a=[int(x) for x in sys.argv[1].split('.')[:2]]; b=[int(x) for x in sys.argv[2].split('.')[:2]]; sys.exit(0 if a>=b else 1)" "$newest" "$allowed"; then
            title="pyatv $newest is out (Tandem allows below $allowed)"
            if gh issue list --state open --limit 200 --json title --jq '.[].title' | grep -Fxq "$title"; then
              echo "An issue is already open." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            gh issue create --title "$title" --body "pyatv has a newer minor version than pyproject.toml allows. New minors often carry fixes for new tvOS and HomePod software. Read https://github.com/postlund/pyatv/releases, move the range and packaging/constraints.txt on purpose, run the tests, and check pairing and audio on the reference devices (CLAUDE.md, ADR-0017). The diagnostics bundle lists each receiver's OS version (os_version) to match reports against."
          fi
