name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Privacy check (docs/PRIVACY.md)
        shell: bash
        run: git ls-files -z | xargs -0 python tools/check_private_info.py
      - name: Lint
        run: |
          python -m ruff check src tests
          python -m ruff format --check src tests
      - name: Type check
        shell: bash
        run: python -m pyright --pythonpath "$(python -c 'import sys; print(sys.executable)')"
      - name: Test
        run: python -m pytest --cov --cov-fail-under=80
